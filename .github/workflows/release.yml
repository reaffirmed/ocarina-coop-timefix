name: release
# Publishes a GitHub release from packages that earlier runs already built, so nothing is rebuilt here:
#   - ocarina-story-coop-windows from a package-windows run
#   - ocarina-story-coop-linux from a generate-builds run
#   - OcarinaStoryCoop-mac from a build-mac run
# Run it by hand from the Actions tab (or `gh workflow run release.yml`). It never touches a ROM:
# the packages only hold the game, server and soh.o2r, which is built from this repo alone.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to create, e.g. v1.0.0
        required: true
      windows_run_id:
        description: package-windows run id to take ocarina-story-coop-windows from
        required: true
      linux_run_id:
        description: generate-builds run id to take ocarina-story-coop-linux from (leave empty to skip Linux)
        required: false
      mac_run_id:
        description: build-mac run id to take OcarinaStoryCoop-mac from (leave empty to skip Mac)
        required: false
      notes:
        description: Release notes in Markdown, shown above the generated list of merged PRs
        required: false
      prerelease:
        description: Mark as a pre-release
        type: boolean
        default: false

permissions:
  contents: write
  actions: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
    - name: Git Checkout
      uses: actions/checkout@v4
    - name: Download Windows package
      uses: actions/download-artifact@v4
      with:
        name: ocarina-story-coop-windows
        path: OcarinaStoryCoop-windows
        run-id: ${{ inputs.windows_run_id }}
        github-token: ${{ secrets.GITHUB_TOKEN }}
    - name: Download Linux package
      if: ${{ inputs.linux_run_id != '' }}
      uses: actions/download-artifact@v4
      with:
        name: ocarina-story-coop-linux
        path: linux
        run-id: ${{ inputs.linux_run_id }}
        github-token: ${{ secrets.GITHUB_TOKEN }}
    - name: Download Mac package
      if: ${{ inputs.mac_run_id != '' }}
      uses: actions/download-artifact@v4
      with:
        name: OcarinaStoryCoop-mac
        path: mac
        run-id: ${{ inputs.mac_run_id }}
        github-token: ${{ secrets.GITHUB_TOKEN }}
    - name: Check packages hold no ROM data
      run: |
        # oot.o2r / oot-mq.o2r are extracted from a player's own ROM and must never be shipped.
        if find . -path ./.git -prune -o -type f \( -iname 'oot*.o2r' -o -iname 'oot*.otr' -o -iname '*.z64' -o -iname '*.n64' -o -iname '*.v64' \) -print | grep .; then
          echo "::error::ROM or ROM-derived files found in the packages"; exit 1
        fi
    - name: Assemble release files
      run: |
        mkdir -p release
        (cd OcarinaStoryCoop-windows && zip -qr ../release/OcarinaStoryCoop-windows.zip .)
        if [ -d linux ]; then cp linux/*.tar.gz release/; fi
        if [ -d mac ]; then
          cp mac/OcarinaStoryCoop-mac.dmg mac/OcarinaStoryCoop-server-mac.zip release/
          cp "mac/Read me.txt" release/Mac-Read-me.txt
        fi
        (cd release && sha256sum * > SHA256SUMS.txt)
        ls -l release
    - name: Create release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        NOTES: ${{ inputs.notes }}
      run: |
        # Tag the commit the Windows package was built from, not whatever main is now.
        sha=$(gh api "repos/${{ github.repository }}/actions/runs/${{ inputs.windows_run_id }}" --jq .head_sha)
        flags=(--generate-notes --target "$sha" --title "${{ inputs.tag }}")
        if [ -n "$NOTES" ]; then flags+=(--notes "$NOTES"); fi
        if [ "${{ inputs.prerelease }}" = "true" ]; then flags+=(--prerelease); fi
        gh release create "${{ inputs.tag }}" release/* "${flags[@]}"
